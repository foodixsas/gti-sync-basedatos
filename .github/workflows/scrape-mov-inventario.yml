name: Scrape Movimientos Inventario (Contifico web)

# Export "Detalle Movimientos Inventario" → contifico_web.mov_inventario_detalle
# - schedule: diario 04:10 EC (ayer + hoy)
# - dispatch: backfill / re-scrape por rango (DD/MM/YYYY)
# Ver src/scripts/scrape-mov-inventario.ts

on:
  schedule:
    - cron: '10 9 * * *'   # 09:10 UTC = 04:10 Ecuador (después de scrape-costos 09:00)
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha inicio (DD/MM/YYYY)'
        required: true
        default: '01/08/2026'
      hasta:
        description: 'Fecha fin (DD/MM/YYYY)'
        required: true
        default: '17/08/2026'
      modo:
        description: 'backfill | manual | semanal | mensual'
        required: true
        default: 'backfill'
      solo:
        description: 'Opcional: un solo slice tipo:origen (ej. EGR:MAN)'
        required: false
        default: ''

# Nunca dos corridas a la vez contra Contifico (las descargas se serializan del lado de ellos)
concurrency:
  group: scrape-mov-inventario
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # apt del runner (espejo azure.archive.ubuntu.com) se colgó/falló en varios jobs (18/19-ago-2026).
      # 1) el navegador se baja del CDN de Playwright (sin apt, nunca se cuelga);
      # 2) las libs del sistema con tope + reintentos, matando apt colgado entre intentos;
      # 3) si apt sigue roto, se continúa: ubuntu-latest ya trae las libs de Chrome.
      - name: Install Playwright Chromium
        timeout-minutes: 25
        run: |
          npx playwright install chromium
          for i in 1 2 3; do
            timeout 300 npx playwright install-deps chromium && exit 0
            echo "install-deps falló/colgó (intento $i)"; sudo pkill -9 -f 'apt-get|dpkg' 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true
            sleep 20
          done
          echo "::warning::install-deps falló 3 veces; se continúa con las libs del runner"
          exit 0

      - name: Run scraper
        env:
          CONTIFICO_EMAIL: ${{ secrets.CONTIFICO_EMAIL }}
          CONTIFICO_PASSWORD: ${{ secrets.CONTIFICO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Domingos: re-bajar los últimos 30 días (captura ediciones retroactivas en Contifico,
            # p.ej. ingresos corregidos días después — caso PAPAS FRANCESAS 18/20-ago-2026).
            if [ "$(date -u +%u)" = "7" ]; then
              npx tsx src/scripts/scrape-mov-inventario.ts --desde "$(date -u -d '30 days ago' +%d/%m/%Y)" --hasta "$(date -u +%d/%m/%Y)" --modo semanal
            else
              npx tsx src/scripts/scrape-mov-inventario.ts
            fi
          else
            SOLO=""
            if [ -n "${{ inputs.solo }}" ]; then SOLO="--solo ${{ inputs.solo }}"; fi
            npx tsx src/scripts/scrape-mov-inventario.ts --desde "${{ inputs.desde }}" --hasta "${{ inputs.hasta }}" --modo "${{ inputs.modo }}" $SOLO
          fi
