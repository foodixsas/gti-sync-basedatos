name: Backfill Movimientos Inventario (Contifico web, por meses)

# Carga histórica de "Detalle Movimientos Inventario" → contifico_web.mov_inventario_detalle
# Un job por mes, en serie (max-parallel 1), del mes más reciente al más antiguo.
# Comparte el grupo de concurrencia con el scraper diario: nunca dos descargas a la vez contra Contifico.
# Uso: gh workflow run backfill-mov-inventario.yml -f desde_mes=2025-01 -f hasta_mes=2026-06

on:
  workflow_dispatch:
    inputs:
      desde_mes:
        description: 'Primer mes a cargar (YYYY-MM, el más antiguo)'
        required: true
        default: '2025-01'
      hasta_mes:
        description: 'Último mes a cargar (YYYY-MM, el más reciente)'
        required: true
        default: '2026-06'
      solo:
        description: 'Opcional: slices tipo:origen separados por coma (ej. EGR:MAN,ING:)'
        required: false
        default: ''
      lista:
        description: 'Opcional: lista explícita de meses YYYY-MM separados por coma (ignora desde/hasta; útil para relanzar meses fallidos)'
        required: false
        default: ''

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      meses: ${{ steps.gen.outputs.meses }}
    steps:
      - id: gen
        run: |
          set -euo pipefail
          items=""
          add_mes() {
            local y=${1:0:4} m=${1:5:2}
            date -d "$y-$m-01" >/dev/null
            local fin; fin=$(date -d "$y-$m-01 +1 month -1 day" +%d)
            items+="{\"mes\":\"$y-$m\",\"desde\":\"01/$m/$y\",\"hasta\":\"$fin/$m/$y\"},"
          }
          LISTA="${{ inputs.lista }}"
          if [ -n "$LISTA" ]; then
            for mes in $(echo "$LISTA" | tr ',' ' '); do add_mes "$mes"; done
          else
            d="${{ inputs.desde_mes }}-01"; h="${{ inputs.hasta_mes }}-01"
            date -d "$d" >/dev/null; date -d "$h" >/dev/null
            if [[ "$d" > "$h" ]]; then echo "desde_mes > hasta_mes"; exit 1; fi
            cur="$h"
            while [[ ! "$cur" < "$d" ]]; do
              add_mes "${cur:0:7}"
              cur=$(date -d "$cur -1 month" +%Y-%m-01)
            done
          fi
          echo "meses=[${items%,}]" >> "$GITHUB_OUTPUT"
          echo "Meses (en orden de ejecución): [${items%,}]"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.meses) }}
    concurrency:
      group: scrape-mov-inventario
      cancel-in-progress: false
    name: mes ${{ matrix.mes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # apt-get del runner se quedó colgado 5h50m en 2 de 25 jobs (18/19-ago-2026) → tope por intento + reintentos
      - name: Install Playwright Chromium
        timeout-minutes: 25
        run: |
          for i in 1 2 3; do
            timeout 420 npx playwright install chromium --with-deps && exit 0
            echo "playwright install falló/colgó (intento $i), reintentando…"; sleep 20
          done
          exit 1

      - name: Scrape ${{ matrix.mes }}
        env:
          CONTIFICO_EMAIL: ${{ secrets.CONTIFICO_EMAIL }}
          CONTIFICO_PASSWORD: ${{ secrets.CONTIFICO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          SOLO=""
          if [ -n "${{ inputs.solo }}" ]; then SOLO="--solo ${{ inputs.solo }}"; fi
          npx tsx src/scripts/scrape-mov-inventario.ts --desde "${{ matrix.desde }}" --hasta "${{ matrix.hasta }}" --modo backfill $SOLO
